name: harvest

on:
  schedule:
    # 4時間おき（X読み取り課金 $0.005/件×10件＝1回$0.05・月約$9）（GitHub cronは混雑時に数時間遅れることがある前提で運用する）
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Run harvester
        run: python harvest.py
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # workflow_dispatch(手動実行)は事故防止のため既定でDRY_RUN。
          # 本番実行させたいときはSecretsではなくRepository variableで
          # DRY_RUN=0を明示するか、cron実行(常にDRY_RUN=0)に任せる。
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
