name: harvest

on:
  schedule:
    # 1日1回 JST 3:17（X読み取り課金 $0.005/件×30件＝1回$0.15・月約$4.5）（GitHub cronは混雑時に数時間遅れることがある前提で運用する）
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=DRY_RUN（既定・DL/アップロードなし） / 0=本番実行"
        type: choice
        options:
          - "1"
          - "0"
        default: "1"

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Run harvester
        run: python harvest.py
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # workflow_dispatch(手動実行)は input dry_run（既定"1"）で選べる。
          # cron実行は常にDRY_RUN=0（本番）。
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run || '1') || '0' }}
